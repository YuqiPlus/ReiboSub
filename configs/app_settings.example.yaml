version: 1

# Reference only. The Web UI writes the real, Git-ignored
# configs/app_settings.yaml. Defaults only apply to newly opened tasks.
defaults:
  source_language: korean
  ocr_language: auto
  target_language: zh
  provider_profile: example

# Each LLM task inherits defaults.provider_profile unless provider_profile is
# set here. Model IDs are sent exactly as written to the selected service.
tasks:
  title_translation:
    model: example-model
  glossary:
    model: example-model
  subtitle_translation:
    model: example-model
  asr_correction:
    model: example-model
  hybrid_source_reconstruction:
    model: example-model
  ocr_source_refinement:
    model: example-model
  ocr_source_cleanup:
    model: example-model
  ocr_geometry_refinement:
    model: example-model

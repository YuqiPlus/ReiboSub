# Copy this file to configs/llm.yaml.
# This file only selects the active provider and task model roles.
# Provider-specific base URLs, API-key env names, and concrete model names live in:
#   configs/llm.providers.qianwen.example.yaml
#   configs/llm.providers.volcano.example.yaml
#
# To switch provider later, change only active_provider after preparing the
# matching configs/llm.providers.<name>.yaml file and API key env var.

active_provider: qianwen

tasks:
  # Small and frequent tasks usually work well with a faster/cheaper model.
  title_translation:
    model_role: lite

  glossary:
    model_role: pro

  subtitle_translation:
    model_role: pro
    fallback_roles:
      - lite

  asr_correction:
    model_role: lite
    # Optional env override. Leave empty in .env to use model_role above.
    env_model: ASR_CORRECTION_MODEL

  hybrid_source_reconstruction:
    model_role: lite

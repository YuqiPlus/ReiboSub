# Copy this file to configs/llm.yaml.
# Generic OpenAI-compatible LLM configuration.
#
# This project does not require provider-specific profile files. To switch from
# Doubao/Volcengine to another provider, change only these generic fields:
#   defaults.base_url
#   defaults.models.*
#   LLM_API_KEY in .env
#
# The example values below use Volcengine Ark / Doubao model IDs.

defaults:
  provider: openai-compatible
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  api_key_env: LLM_API_KEY
  models:
    default: doubao-seed-2.0-pro
    pro: doubao-seed-2.0-pro
    lite: doubao-seed-2.0-lite
    code: doubao-seed-2.0-code
    minimax: minimax-m2.7

tasks:
  # Small and frequent tasks usually work well with a faster/cheaper model.
  title_translation:
    model_role: lite

  glossary:
    model_role: pro

  subtitle_translation:
    model_role: pro
    fallback_roles:
      - lite

  asr_correction:
    model_role: lite
    # Optional env override. Leave empty in .env to use model_role above.
    env_model: ASR_CORRECTION_MODEL

  hybrid_source_reconstruction:
    model_role: lite

  ocr_source_refinement:
    model_role: lite

  ocr_source_cleanup:
    model_role: lite

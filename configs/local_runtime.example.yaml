version: 1

# Copy this file to configs/local_runtime.yaml for machine-local runtime
# settings. The destination file is ignored by Git.
environment:
  # Safe default: this UI has no built-in login. Use 0.0.0.0 only on a
  # trusted LAN, or keep 127.0.0.1 and connect through an SSH tunnel.
  VIDEO_TRANSLATE_HOST: 127.0.0.1
  VIDEO_TRANSLATE_PORT: 7860
  VIDEO_TRANSLATE_DOWNLOAD_DIR: YoutubeDownloads
  VIDEO_TRANSLATE_CACHE_DIR: models
  VIDEO_TRANSLATE_OCR_DEVICE: auto
  YTDLP_PROXY: ""

[project]
name = "video-translate"
version = "0.1.0"
description = "Human-in-the-loop OCR, ASR, glossary, translation, and subtitle refinement for video."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["subtitle", "ocr", "asr", "translation", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "opencv-python>=4.8,<5",
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0,<4",
    "Pillow>=10,<13",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
video-translate = "video_translate.cli:main"

[project.urls]
Homepage = "https://github.com/YuqiPlus/Video_Translate"
Repository = "https://github.com/YuqiPlus/Video_Translate.git"
Issues = "https://github.com/YuqiPlus/Video_Translate/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translate*"]

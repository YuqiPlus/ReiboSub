[project]
name = "video-translate"
version = "0.1.0"
description = "Extract hard subtitles from videos, filter overlay noise, and prepare translated subtitle files."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<5",
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0,<4",
    "Pillow>=10,<13",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
video-translate = "video_translate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translate*"]

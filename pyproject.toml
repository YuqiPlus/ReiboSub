[project]
name = "reibosub"
version = "0.1.0"
description = "Human-in-the-loop OCR, ASR, glossary, translation, and subtitle refinement for video."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["subtitle", "ocr", "asr", "translation", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "opencv-python>=4.8,<5",
    "paddleocr>=3.0,<4",
    "Pillow>=10,<13",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
ocr-cpu = [
    "paddlepaddle>=3.0,<4",
]
asr = [
    "faster-whisper>=1.1.0",
]
diarization = [
    "pyannote.audio>=4.0,<5",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
reibosub = "video_translate.cli:main"
video-translate = "video_translate.cli:main"

[project.urls]
Homepage = "https://github.com/YuqiPlus/ReiboSub"
Repository = "https://github.com/YuqiPlus/ReiboSub.git"
Issues = "https://github.com/YuqiPlus/ReiboSub/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translate*"]

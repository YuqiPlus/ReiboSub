[project]
name = "reibosub"
version = "0.1.0"
description = "Human-in-the-loop OCR, ASR, glossary, translation, and subtitle refinement for video."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["subtitle", "ocr", "asr", "translation", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "packaging>=24",
]

[project.optional-dependencies]
translate = [
    "requests>=2.31,<3",
    "pyyaml>=6.0,<7",
]
download = [
    "reibosub[translate]",
    "yt-dlp[default]>=2026.8.19",
    "Pillow>=10,<13",
]
video = [
    "opencv-python>=4.8,<5",
    "Pillow>=10,<13",
]
ocr = [
    "reibosub[video,translate]",
    "paddleocr>=3.0,<4",
]
web = [
    "reibosub[download,translate]",
]
all-cpu = [
    "reibosub[web,ocr-cpu,asr]",
]
ocr-cpu = [
    "reibosub[ocr]",
    "paddlepaddle>=3.0,<4",
]
asr = [
    "faster-whisper>=1.1.0",
]
diarization = [
    "pyannote.audio>=4.0,<5",
]
dev = [
    "pytest>=8.0",
    "reibosub[translate]",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
reibosub = "reibosub.cli:main"
video-translate = "video_translate.cli:main"

[project.urls]
Homepage = "https://github.com/YuqiPlus/ReiboSub"
Repository = "https://github.com/YuqiPlus/ReiboSub.git"
Issues = "https://github.com/YuqiPlus/ReiboSub/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translate*", "reibosub*"]

[tool.setuptools.package-data]
reibosub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

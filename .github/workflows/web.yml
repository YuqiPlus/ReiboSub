name: Test web application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'video_translate/**'
      - 'frontend/**'
      - 'tests/**'
      - 'packages/subtitles/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'environment.yml'
      - 'run_agent_ui.py'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './packages/subtitles[dev]' -e '.[web,dev]'
      - run: python -m pytest tests/test_web_bootstrap.py tests/test_optional_features.py tests/test_product_boundaries.py tests/test_chinese_asr_output.py tests/test_subtitle_toolbox.py tests/test_release_distribution.py -q
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --include=dev
      - run: node --test src/*.test.mjs
      - run: npm run build

name: Check or publish subtitle toolkit

on:
  pull_request:
    paths:
      - 'packages/subtitles/**'
      - 'scripts/check_distribution.py'
      - 'scripts/smoke_installed_package.py'
      - 'tests/test_release_distribution.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish a NEW version from a matching version tag'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate release version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: |
          python - <<'PY'
          import ast, os, re, tomllib
          from pathlib import Path
          version = tomllib.load(open('packages/subtitles/pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Only stable version tags are supported'
          source = ast.parse(Path('packages/subtitles/src/reibosub/__init__.py').read_text())
          declared = [node.value.value for node in source.body
                      if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant)
                      and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)]
          assert declared == [version], 'Toolkit __version__ must match package metadata'
          if os.environ.get('PUBLISH_REQUESTED') == 'true':
              assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Publishing must be explicitly run from a version tag, not main'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          PY
      - name: Prepare isolated build tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10' 'packaging>=24' 'pyyaml>=6,<7'
      - name: Test distribution safety checks
        run: python -m pytest tests/test_release_distribution.py -q
      - name: Build wheel and source distribution
        run: python -m build packages/subtitles --outdir dist
      - name: Check metadata and public file allowlist
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install only the default wheel dependencies
        run: python -m pip install dist/*.whl
      - name: Exercise installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"
      - name: Install API test dependencies
        run: python -m pip install 'pytest>=8,<10' 'tomli>=2; python_version < "3.11"'
      - name: Test the installed API, not checkout imports
        run: |
          mkdir -p "$RUNNER_TEMP/package-tests/tests"
          cp packages/subtitles/tests/*.py "$RUNNER_TEMP/package-tests/tests/"
          cp packages/subtitles/pyproject.toml "$RUNNER_TEMP/package-tests/"
          cp -R packages/subtitles/examples "$RUNNER_TEMP/package-tests/"
          cd "$RUNNER_TEMP/package-tests"
          python -m pytest tests -q
          python -m pip check
      - name: Confirm the source archive can be installed
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv sdist-env
          sdist-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          sdist-env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag' && github.repository == 'YuqiPlus/ReiboSub'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/reibosub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish checked distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

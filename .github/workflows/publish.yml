name: Publish Python package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate release version
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Only stable version tags are supported'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          PY
      - name: Prepare isolated build tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10' 'packaging>=24' 'pyyaml>=6,<7'
      - name: Test distribution safety checks
        run: python -m pytest tests/test_release_distribution.py -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check metadata and public file allowlist
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install only the default wheel dependencies
        run: python -m pip install dist/*.whl
      - name: Exercise installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"
      - name: Install API test dependencies
        run: python -m pip install 'pytest>=8,<10' 'requests>=2.31,<3' 'pyyaml>=6,<7' 'tomli>=2; python_version < "3.11"'
      - name: Test the installed API, not checkout imports
        run: |
          mkdir -p "$RUNNER_TEMP/package-tests/tests"
          cp tests/test_public*.py tests/test_optional_features.py "$RUNNER_TEMP/package-tests/tests/"
          cp pyproject.toml "$RUNNER_TEMP/package-tests/"
          cp -R examples "$RUNNER_TEMP/package-tests/"
          cd "$RUNNER_TEMP/package-tests"
          python -m pytest tests -q
          python -m pip check
      - name: Confirm the source archive can be installed
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv sdist-env
          sdist-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          sdist-env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'YuqiPlus/ReiboSub'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/reibosub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish checked distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
